<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How Open Memo works</title>
  <desc id="desc">Hold your hotkey, speak naturally, release the key, and polished text appears at your cursor.</desc>
  <defs>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#c26d50" stop-opacity=".94"/>
      <stop offset=".55" stop-color="#c26d50" stop-opacity=".82"/>
      <stop offset="1" stop-color="#c26d50" stop-opacity=".9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#8f422f" flood-opacity=".45"/>
    </filter>
  </defs>
  <g fill="none" stroke="#c26d50" stroke-opacity=".8" stroke-width="3" stroke-linecap="round">
    <path d="M278 150h40"/><path d="m310 142 10 8-10 8"/>
    <path d="M578 150h40"/><path d="m610 142 10 8-10 8"/>
    <path d="M878 150h40"/><path d="m910 142 10 8-10 8"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="50" width="238" height="200" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".38"/>
    <rect x="340" y="50" width="238" height="200" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".38"/>
    <rect x="640" y="50" width="238" height="200" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".38"/>
    <rect x="940" y="50" width="220" height="200" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".38"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g fill="#ffffff">
      <rect x="112" y="83" width="94" height="56" rx="14" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/>
      <text x="159" y="119" font-size="23" font-weight="700">Fn</text>
      <text x="159" y="183" font-size="21" font-weight="700">Hold</text>
      <text x="159" y="211" font-size="15" fill="#ffffff" fill-opacity=".68">your hotkey</text>
    </g>
    <g fill="#ffffff">
      <rect x="452" y="88" width="14" height="40" rx="7" fill="#ffffff"/>
      <path d="M442 119v5a17 17 0 0 0 34 0v-5M459 141v11M447 152h24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="459" y="183" font-size="21" font-weight="700">Speak</text>
      <text x="459" y="211" font-size="15" fill="#ffffff" fill-opacity=".68">naturally</text>
    </g>
    <g fill="#ffffff">
      <circle cx="759" cy="113" r="34" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".34"/>
      <path d="M749 103l20 20M769 103l-20 20" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <text x="759" y="183" font-size="21" font-weight="700">Release</text>
      <text x="759" y="211" font-size="15" fill="#ffffff" fill-opacity=".68">to transcribe</text>
    </g>
    <g fill="#ffffff">
      <rect x="973" y="80" width="154" height="71" rx="14" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/>
      <text x="1050" y="108" font-size="13" fill="#ffffff" fill-opacity=".68">New message</text>
      <text x="1050" y="132" font-size="14" font-weight="600">Meet me at ten.</text>
      <path d="M1109 121v17" stroke="#ffffff" stroke-width="2"/>
      <text x="1050" y="183" font-size="21" font-weight="700">Done</text>
      <text x="1050" y="211" font-size="15" fill="#ffffff" fill-opacity=".68">text appears</text>
    </g>
  </g>
</svg>
