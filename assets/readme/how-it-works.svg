<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">How Open Memo works</title>
  <desc id="desc">Hold your function key, speak, then release. Memo transcribes locally and inserts the finished text.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121218"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d78366"/>
      <stop offset="1" stop-color="#b75f44"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#050508"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#fff" stroke-opacity=".06"/>
  <g filter="url(#shadow)">
    <rect x="54" y="34" width="1092" height="252" rx="18" fill="url(#canvas)" stroke="#fff" stroke-opacity=".1"/>
    <path d="M54 72h1092" stroke="#fff" stroke-opacity=".06"/>
  </g>
  <g>
    <circle cx="78" cy="53" r="5" fill="#fff" fill-opacity=".16"/>
    <circle cx="96" cy="53" r="5" fill="#fff" fill-opacity=".12"/>
    <circle cx="114" cy="53" r="5" fill="#fff" fill-opacity=".09"/>
    <text x="600" y="58" fill="#fff" fill-opacity=".48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle">Memo</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="90" y="111" fill="#fff" fill-opacity=".42" font-size="11" font-weight="600" letter-spacing="1.4">DICTATE ANYWHERE</text>
    <g transform="translate(90 132)">
      <rect width="64" height="48" rx="9" fill="#000" stroke="#fff" stroke-opacity=".13"/>
      <path d="M8 39h48" stroke="#fff" stroke-opacity=".14" stroke-width="3" stroke-linecap="round"/>
      <text x="32" y="30" fill="#fff" fill-opacity=".92" font-size="15" font-weight="600" text-anchor="middle">fn</text>
    </g>
    <text x="90" y="207" fill="#fff" fill-opacity=".92" font-size="17" font-weight="600">Hold</text>
    <text x="90" y="230" fill="#fff" fill-opacity=".46" font-size="13">your hotkey</text>
    <path d="M249 173h54" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
    <path d="m298 168 6 5-6 5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(347 132)">
      <rect width="64" height="48" rx="12" fill="#c26d50" fill-opacity=".14" stroke="#c26d50" stroke-opacity=".3"/>
      <rect x="27" y="9" width="10" height="21" rx="5" fill="url(#accent)"/>
      <path d="M21 25v2a11 11 0 0 0 22 0v-2M32 38v6M24 44h16" fill="none" stroke="#d78366" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="347" y="207" fill="#fff" fill-opacity=".92" font-size="17" font-weight="600">Speak</text>
    <text x="347" y="230" fill="#fff" fill-opacity=".46" font-size="13">naturally</text>
    <path d="M506 173h54" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
    <path d="m555 168 6 5-6 5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(604 132)">
      <rect width="64" height="48" rx="9" fill="#000" stroke="#c26d50" stroke-opacity=".42"/>
      <path d="M8 39h48" stroke="#c26d50" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
      <text x="32" y="30" fill="#fff" fill-opacity=".92" font-size="15" font-weight="600" text-anchor="middle">fn</text>
    </g>
    <text x="604" y="207" fill="#fff" fill-opacity=".92" font-size="17" font-weight="600">Release</text>
    <text x="604" y="230" fill="#fff" fill-opacity=".46" font-size="13">to finish</text>
    <path d="M763 173h54" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
    <path d="m812 168 6 5-6 5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(861 120)">
      <rect width="242" height="82" rx="12" fill="#121218" stroke="#fff" stroke-opacity=".1"/>
      <circle cx="22" cy="22" r="7" fill="#c26d50"/>
      <text x="38" y="26" fill="#fff" fill-opacity=".45" font-size="11" font-weight="500">Notes</text>
      <text x="18" y="57" fill="#fff" fill-opacity=".92" font-size="16">Meet me at ten.</text>
      <rect x="150" y="43" width="1.5" height="20" rx="1" fill="#c26d50"/>
    </g>
    <text x="861" y="229" fill="#fff" fill-opacity=".46" font-size="13">Inserted at your cursor</text>
    <g transform="translate(90 254)">
      <circle cx="5" cy="5" r="5" fill="#c26d50"/>
      <text x="18" y="9" fill="#fff" fill-opacity=".4" font-size="11" font-weight="500">Private, on-device transcription</text>
    </g>
  </g>
</svg>
