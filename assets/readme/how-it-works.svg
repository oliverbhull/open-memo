<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">How Open Memo works</title>
  <desc id="desc">Hold your hotkey, speak naturally, release the key, and polished text appears at your cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round">
    <path d="M278 150h40"/><path d="m310 142 10 8-10 8"/>
    <path d="M578 150h40"/><path d="m610 142 10 8-10 8"/>
    <path d="M878 150h40"/><path d="m910 142 10 8-10 8"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="50" width="238" height="200" rx="18" fill="#ffffff"/>
    <rect x="340" y="50" width="238" height="200" rx="18" fill="#ffffff"/>
    <rect x="640" y="50" width="238" height="200" rx="18" fill="#ffffff"/>
    <rect x="940" y="50" width="220" height="200" rx="18" fill="#ffffff"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g fill="#111827">
      <rect x="112" y="83" width="94" height="56" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
      <text x="159" y="119" font-size="23" font-weight="700">Fn</text>
      <text x="159" y="183" font-size="21" font-weight="700">Hold</text>
      <text x="159" y="211" font-size="15" fill="#64748b">your hotkey</text>
    </g>
    <g fill="#111827">
      <rect x="432" y="78" width="54" height="72" rx="27" fill="#dcfce7"/>
      <rect x="452" y="88" width="14" height="40" rx="7" fill="#16a34a"/>
      <path d="M442 119v5a17 17 0 0 0 34 0v-5M459 141v11M447 152h24" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
      <text x="459" y="183" font-size="21" font-weight="700">Speak</text>
      <text x="459" y="211" font-size="15" fill="#64748b">naturally</text>
    </g>
    <g fill="#111827">
      <circle cx="759" cy="113" r="34" fill="#fee2e2"/>
      <path d="M749 103l20 20M769 103l-20 20" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
      <text x="759" y="183" font-size="21" font-weight="700">Release</text>
      <text x="759" y="211" font-size="15" fill="#64748b">to transcribe</text>
    </g>
    <g fill="#111827">
      <rect x="973" y="80" width="154" height="71" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <text x="1050" y="108" font-size="13" fill="#64748b">New message</text>
      <text x="1050" y="132" font-size="14" font-weight="600">Meet me at ten.</text>
      <path d="M1109 121v17" stroke="#2563eb" stroke-width="2"/>
      <text x="1050" y="183" font-size="21" font-weight="700">Done</text>
      <text x="1050" y="211" font-size="15" fill="#64748b">text appears</text>
    </g>
  </g>
</svg>
