<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">How Open Memo works</title>
  <desc id="desc">Hold your function key, speak, then release. Memo transcribes locally and inserts the finished text.</desc>
  <rect width="1200" height="320" rx="20" fill="#0A0A0C"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#242428" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="90" y="82" fill="#8A8A90" font-size="11" font-weight="600" letter-spacing="1.4">DICTATE ANYWHERE</text>
    <g transform="translate(90 132)">
      <rect width="64" height="48" rx="9" fill="#18181C" stroke="#34343A"/>
      <path d="M8 39h48" stroke="#34343A" stroke-width="3" stroke-linecap="round"/>
      <text x="32" y="30" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">fn</text>
    </g>
    <text x="90" y="207" fill="#F2F2F3" font-size="17" font-weight="600">Hold</text>
    <text x="90" y="230" fill="#8A8A90" font-size="13">your hotkey</text>
    <path d="M249 173h54" stroke="#5A5A60" stroke-width="2"/>
    <path d="m298 168 6 5-6 5" fill="none" stroke="#8A8A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(347 132)">
      <rect width="64" height="48" rx="12" fill="#C26D50"/>
      <rect x="27" y="9" width="10" height="21" rx="5" fill="#0A0A0C"/>
      <path d="M21 25v2a11 11 0 0 0 22 0v-2M32 38v6M24 44h16" fill="none" stroke="#0A0A0C" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="347" y="207" fill="#F2F2F3" font-size="17" font-weight="600">Speak</text>
    <text x="347" y="230" fill="#8A8A90" font-size="13">naturally</text>
    <path d="M506 173h54" stroke="#5A5A60" stroke-width="2"/>
    <path d="m555 168 6 5-6 5" fill="none" stroke="#8A8A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(604 132)">
      <rect width="64" height="48" rx="9" fill="#18181C" stroke="#C26D50"/>
      <path d="M8 39h48" stroke="#C26D50" stroke-width="3" stroke-linecap="round"/>
      <text x="32" y="30" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">fn</text>
    </g>
    <text x="604" y="207" fill="#F2F2F3" font-size="17" font-weight="600">Release</text>
    <text x="604" y="230" fill="#8A8A90" font-size="13">to finish</text>
    <path d="M763 173h54" stroke="#5A5A60" stroke-width="2"/>
    <path d="m812 168 6 5-6 5" fill="none" stroke="#8A8A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(861 120)">
      <rect width="242" height="82" rx="12" fill="#18181C" stroke="#34343A"/>
      <circle cx="22" cy="22" r="7" fill="#C26D50"/>
      <text x="38" y="26" fill="#8A8A90" font-size="11" font-weight="500">Notes</text>
      <text x="18" y="57" fill="#F2F2F3" font-size="16">Meet me at ten.</text>
      <rect x="150" y="43" width="1.5" height="20" rx="1" fill="#C26D50"/>
    </g>
    <text x="861" y="229" fill="#8A8A90" font-size="13">Inserted at your cursor</text>
    <g transform="translate(90 254)">
      <circle cx="5" cy="5" r="5" fill="#C26D50"/>
      <text x="18" y="9" fill="#727278" font-size="11" font-weight="500">Private, on-device transcription</text>
    </g>
  </g>
</svg>
