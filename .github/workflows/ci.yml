name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.19"

      - name: Install native build tools
        run: brew install autoconf automake libtool pkg-config

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/dictation-target
          key: ${{ runner.os }}-dictation-${{ hashFiles('scripts/shell/build-dictation.sh', 'sidecars/dictation/Cargo.toml', 'sidecars/dictation/Cargo.lock', 'sidecars/dictation/src/**') }}
          restore-keys: |
            ${{ runner.os }}-dictation-

      - name: Cache conomo bundle
        uses: actions/cache@v4
        with:
          path: .build/conomo
          key: ${{ runner.os }}-${{ runner.arch }}-conomo-${{ hashFiles('scripts/shell/build-conomo.sh', 'sidecars/conomo/requirements-device.txt', 'runtimes/conomo/conomo/model-manifest.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Test owned dictation sidecar
        run: cargo test --locked --manifest-path sidecars/dictation/Cargo.toml

      - name: Test application services and release contracts
        run: npm test

      - name: Build unsigned app
        run: |
          npm run build:dir

      - name: Test Conomo protocol, vocabulary, and model installation
        run: PYTHONPATH=runtimes/conomo .build/conomo/device-runtime/bin/python3.12 -B -m unittest discover -s runtimes/conomo/tests -v

      - name: Verify packaged dictation sidecar
        run: |
          test -x dist/mac-arm64/Memo.app/Contents/Resources/dictation/memo-dictation

      - name: Verify packaged speech and punctuation
        run: bash scripts/shell/verify-packaged-model-workers.sh dist/mac-arm64/Memo.app

      - name: Verify retired cleanup model is absent
        run: test ! -e dist/mac-arm64/Memo.app/Contents/Resources/cleanup

      - name: Upload app smoke-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-memo-macos-dir
          path: dist/mac-arm64/Memo.app
          if-no-files-found: error
