name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.19"

      - name: Install native build tools
        run: brew install autoconf automake libtool opus pkg-config

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/dictation-target
          key: ${{ runner.os }}-dictation-${{ hashFiles('scripts/shell/build-dictation.sh', 'sidecars/dictation/Cargo.toml', 'sidecars/dictation/Cargo.lock', 'sidecars/dictation/src/**') }}
          restore-keys: |
            ${{ runner.os }}-dictation-

      - name: Cache conomo bundle
        uses: actions/cache@v4
        with:
          path: .build/conomo
          key: ${{ runner.os }}-${{ runner.arch }}-conomo-${{ hashFiles('scripts/shell/build-conomo.sh', 'sidecars/conomo/requirements-device.txt') }}

      - name: Install dependencies
        run: npm ci

      - name: Test owned dictation sidecar
        run: cargo test --locked --manifest-path sidecars/dictation/Cargo.toml

      - name: Test macOS signing policy
        run: node --test scripts/sign.test.cjs

      - name: Validate contextual replay manifest
        run: npm run test:contextual-dictation -- --validate-only

      - name: Build unsigned app
        run: |
          export CONOMO_SOURCE="scripts/fixtures/conomo-bundle"
          export CONOMO_SHA256="$(shasum -a 256 "${CONOMO_SOURCE}/conomo" | awk '{print $1}')"
          npm run build:dir

      - name: Verify packaged dictation sidecar
        run: test -x dist/mac-arm64/Memo.app/Contents/Resources/dictation/memo-dictation

      - name: Verify packaged conomo backend
        run: bash scripts/shell/verify-conomo-bundle.sh dist/mac-arm64/Memo.app/Contents/Resources/conomo

      - name: Upload app smoke-build artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-memo-macos-dir
          path: dist/mac-arm64/Memo.app
          if-no-files-found: error
