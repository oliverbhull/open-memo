name: Windows installer check
on:
  push:
    branches: [codex/windows-preview]
  pull_request:
    paths:
      - 'electron/**'
      - 'sidecars/dictation/**'
      - 'scripts/**'
      - 'config/**'
      - 'package*.json'
      - '.github/workflows/windows*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Check shared source and platform contracts
        run: npm run check:windows
      - name: Test native dictation
        run: cargo test --locked --manifest-path sidecars/dictation/Cargo.toml
      - name: Stage and verify Nemotron assets
        timeout-minutes: 10
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/stage-nemotron.ps1
      - name: Stage and smoke-test punctuation assets
        timeout-minutes: 10
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/stage-pnc.ps1
      - name: Build installer and test bundled speech model
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Open-Memo-Windows-preview
          path: dist/*-windows-x64-setup.exe
          if-no-files-found: error
