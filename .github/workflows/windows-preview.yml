name: Windows preview installer
on:
  push:
    branches: [codex/windows-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: npm ci
      - name: Test native dictation
        run: cargo test --locked --manifest-path sidecars/dictation/Cargo.toml
      - name: Build installer and test bundled speech model
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Open-Memo-Windows-preview
          path: dist/*-windows-x64-setup.exe
          if-no-files-found: error
