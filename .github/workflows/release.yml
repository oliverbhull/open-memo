name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, commit, or existing tag to build"
        required: true
        default: "main"
        type: string
      publish:
        description: "Publish a GitHub release (ref must be an existing version tag)"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Build signed macOS release
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Verify release tag matches app version
        if: github.event_name == 'push' || inputs.publish
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${expected_tag}." >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}" || {
            echo "Publishing requires an existing tag: ${RELEASE_TAG}." >&2
            exit 1
          }

      - name: Verify tagged commit passed main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor "${release_sha}" origin/main || {
            echo "Release commit ${release_sha} is not on origin/main." >&2
            exit 1
          }
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${release_sha}&status=completed" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | sort_by(.created_at) | last | .conclusion // ""')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "Release commit ${release_sha} does not have a successful main push CI run." >&2
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.19"

      - name: Install native build tools
        run: brew install autoconf automake libtool opus pkg-config

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/dictation-target
          key: ${{ runner.os }}-dictation-${{ hashFiles('scripts/shell/build-dictation.sh', 'sidecars/dictation/Cargo.toml', 'sidecars/dictation/Cargo.lock', 'sidecars/dictation/src/**') }}
          restore-keys: |
            ${{ runner.os }}-dictation-

      - name: Cache conomo bundle
        uses: actions/cache@v4
        with:
          path: .build/conomo
          key: ${{ runner.os }}-${{ runner.arch }}-conomo-${{ hashFiles('scripts/shell/build-conomo.sh', 'sidecars/conomo/requirements-device.txt') }}

      - name: Cache punctuation bundle
        uses: actions/cache@v4
        with:
          path: .build/pnc
          key: ${{ runner.os }}-${{ runner.arch }}-pnc-${{ hashFiles('scripts/shell/build-pnc.sh', 'scripts/python/convert-distilbert-pnc-coreml.py', 'sidecars/pnc/**') }}

      - name: Cache cleanup bundle
        uses: actions/cache@v4
        with:
          path: .build/cleanup
          key: ${{ runner.os }}-${{ runner.arch }}-cleanup-${{ secrets.CLEANUP_SHA256 }}

      - name: Install dependencies
        run: npm ci

      - name: Test owned dictation sidecar
        run: cargo test --locked --manifest-path sidecars/dictation/Cargo.toml

      - name: Test macOS signing policy
        run: node --test scripts/sign.test.cjs scripts/release-artifacts.test.cjs scripts/app-update.test.cjs

      - name: Validate contextual replay manifest
        run: npm run test:contextual-dictation -- --validate-only

      - name: Import Developer ID certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PWD: ${{ secrets.MAC_CERT_PWD }}
        run: |
          if [[ -z "${MAC_CERT_P12}" || -z "${MAC_CERT_PWD}" ]]; then
            echo "Missing MAC_CERT_P12 or MAC_CERT_PWD secrets." >&2
            exit 1
          fi

          echo "${MAC_CERT_P12}" | base64 --decode > /tmp/open-memo-dev-id.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/open-memo-dev-id.p12 -k build.keychain -P "${MAC_CERT_PWD}" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          security list-keychains -d user -s build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Build signed and notarized app
        env:
          CONOMO_URL: ${{ secrets.CONOMO_URL }}
          CONOMO_SHA256: ${{ secrets.CONOMO_SHA256 }}
          CONOMO_TOKEN: ${{ secrets.CONOMO_TOKEN }}
          CLEANUP_URL: ${{ secrets.CLEANUP_URL }}
          CLEANUP_SHA256: ${{ secrets.CLEANUP_SHA256 }}
          CLEANUP_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          DEBUG: electron-notarize*
        run: |
          if [[ -z "${CONOMO_URL}" || -z "${CONOMO_SHA256}" || -z "${CONOMO_TOKEN}" || -z "${CLEANUP_URL}" || -z "${CLEANUP_SHA256}" || -z "${APPLE_TEAM_ID}" || -z "${APPLE_API_KEY_BASE64}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER}" ]]; then
            echo "Missing model bundle or Apple release secrets." >&2
            exit 1
          fi

          mkdir -p private_keys
          echo "${APPLE_API_KEY_BASE64}" | base64 --decode > "private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          export APPLE_API_KEY="${PWD}/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          export CSC_NAME="${CSC_NAME#Developer ID Application: }"

          npm run release:mac

      - name: Verify signed app
        run: |
          version="$(node -p "require('./package.json').version")"
          full_update="$(node -e "const versions=require('./config/full-model-update-versions.json'); process.stdout.write(versions.includes(process.argv[1]) ? '1' : '0')" "${version}")"
          installer_mount="$(mktemp -d /tmp/memo-installer.XXXXXX)"
          hdiutil attach "dist/Open-Memo-${version}-arm64.dmg" -nobrowse -readonly -mountpoint "${installer_mount}"
          trap 'hdiutil detach "${installer_mount}" >/dev/null 2>&1 || true; rm -rf "${installer_mount}"' EXIT
          installer_app="${installer_mount}/Memo.app"
          test "$(defaults read "${installer_app}/Contents/Info" CFBundleShortVersionString)" = "${version}"
          bash scripts/shell/verify-conomo-bundle.sh "${installer_app}/Contents/Resources/conomo"
          bash scripts/shell/verify-pnc-bundle.sh "${installer_app}/Contents/Resources/pnc"
          bash scripts/shell/verify-cleanup-bundle.sh "${installer_app}/Contents/Resources/cleanup"
          test "$(jq -r .fixture "${installer_app}/Contents/Resources/cleanup/manifest.json")" = false
          test "$(jq -r .status "${installer_app}/Contents/Resources/cleanup/manifest.json")" = production_ready
          codesign --verify --deep --strict --verbose=2 "${installer_app}"
          spctl --assess --type execute --verbose "${installer_app}"
          hdiutil detach "${installer_mount}"
          rm -rf "${installer_mount}"
          trap - EXIT
          if [[ "${full_update}" != "1" ]]; then
            test ! -e dist/mac-arm64/Memo.app/Contents/Resources/conomo
            test ! -e dist/mac-arm64/Memo.app/Contents/Resources/pnc
            test ! -e dist/mac-arm64/Memo.app/Contents/Resources/cleanup
          fi
          dictation_bin="dist/mac-arm64/Memo.app/Contents/Resources/dictation/memo-dictation"
          test -x "${dictation_bin}"
          codesign --verify --strict --verbose=2 "${dictation_bin}"
          codesign -d --entitlements :- "${dictation_bin}" > /tmp/memo-dictation-entitlements.plist
          grep -F '<key>com.apple.security.device.audio-input</key>' /tmp/memo-dictation-entitlements.plist
          grep -F '<key>com.apple.security.device.microphone</key>' /tmp/memo-dictation-entitlements.plist
          codesign -dv "${dictation_bin}" 2>&1 | grep -F 'Identifier=com.memo.desktop.dictation'
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Memo.app
          spctl --assess --type execute --verbose dist/mac-arm64/Memo.app
          xcrun stapler validate dist/mac-arm64/Memo.app

      - name: Collect release artifacts
        run: |
          mkdir -p release-artifacts
          node scripts/release-artifacts.cjs dist
          shopt -s nullglob
          dmg_artifacts=(dist/Open-Memo-*.dmg)
          artifacts=(dist/Open-Memo-*.dmg dist/Open-Memo-*.zip dist/latest-mac.yml)
          cp "${artifacts[@]}" release-artifacts/
          cp "${dmg_artifacts[0]}" release-artifacts/Open-Memo-latest-arm64.dmg
          ls -lh release-artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-memo-release
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
