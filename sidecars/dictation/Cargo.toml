[package]
edition = "2021"
rust-version = "1.74"
name = "memo-dictation"
version = "0.1.1"
authors = ["Oliver Hull <ohull7@gmail.com>"]
description = "Open Memo's native dictation sidecar"
license = "MIT"
repository = "https://github.com/oliverbhull/open-memo"

[lib]
name = "memo_dictation"
path = "src/lib.rs"

[[bin]]
name = "memo-dictation"
path = "src/main.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.audiopus]
version = "0.2"

[dependencies.base64]
version = "0.22"

[dependencies.cpal]
version = "0.15"

[dependencies.log]
version = "0.4"

[dependencies.num_cpus]
version = "1.0"

[dependencies.rdev]
version = "0.5"

[dependencies.serde_json]
version = "1.0"

[dependencies.whisper-rs]
version = "0.12"
features = ["metal"]

[profile.dev]
opt-level = 0
debug = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
