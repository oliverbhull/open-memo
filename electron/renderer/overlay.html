<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none';">
  <title>Memo Overlay</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      pointer-events: none;
    }

    :root {
      --primary-color: #C26D50;
    }

    /* ── Waveform ─────────────────────────────────────── */

    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 46px;
      height: 34px;
    }

    .bar {
      width: 3px;
      flex: 0 0 3px;
      height: 3px;
      background: var(--primary-color);
      border-radius: 999px;
      transform-origin: center center;
    }

    .idle .bar {
      height: 3px !important;
    }

  </style>
</head>

<body>
  <div class="waveform idle" id="waveform">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <script>
    // Seven normalized meter values from the dictation sidecar.
    const waveform = document.getElementById("waveform");
    const bars = Array.from(document.querySelectorAll(".bar"));
    const MIN_HEIGHT = 3;
    const MAX_HEIGHT = 32;
    const OPEN_THRESHOLD = 0.07;
    const CLOSE_THRESHOLD = 0.04;
    const ATTACK_MS = 30;
    const RELEASE_MS = 80;
    const STALE_MS = 250;
    const TRAIL_MS = 260;
    const BAR_DELAY_MS = TRAIL_MS / (bars.length - 1);

    let isRecording = false;
    let primaryColor = "#C26D50";
    let frameId = null;
    let lastFrame = 0;
    let lastAudioUpdate = 0;
    let gateOpen = false;
    let inputLevel = 0;
    const history = [];
    const displayed = bars.map(() => 0);
    // Shorter outer bars soften the overall silhouette into a rounded contour.
    const contour = bars.map((_, index) => {
      const position = (index / (bars.length - 1)) * 2 - 1;
      return 0.42 + 0.58 * Math.sqrt(Math.max(0, 1 - position * position));
    });

    function resetBars() {
      gateOpen = false;
      inputLevel = 0;
      history.length = 0;
      history.push({ time: performance.now(), level: 0 });
      displayed.fill(0);
      waveform.classList.add("idle");
      bars.forEach((bar) => { bar.style.height = `${MIN_HEIGHT}px`; });
    }

    function levelAt(time) {
      if (time < history[0].time) return 0;
      for (let index = 1; index < history.length; index++) {
        const right = history[index];
        if (right.time < time) continue;
        const left = history[index - 1];
        const span = right.time - left.time;
        const mix = span > 0 ? (time - left.time) / span : 1;
        return left.level + (right.level - left.level) * mix;
      }
      return history[history.length - 1].level;
    }

    function tick(now) {
      if (!isRecording) {
        frameId = null;
        return;
      }
      const elapsed = Math.max(0, Math.min(64, now - lastFrame));
      lastFrame = now;
      if (Date.now() - lastAudioUpdate > STALE_MS) {
        gateOpen = false;
        inputLevel = 0;
      }
      history.push({ time: now, level: inputLevel });
      // Keep one sample before the oldest delayed bar for interpolation.
      while (history.length > 2 && history[1].time < now - TRAIL_MS - 64) history.shift();
      let moving = false;
      bars.forEach((bar, index) => {
        const current = displayed[index];
        // Each syllable enters on the left and reaches the right 260ms later.
        const speechTime = now - index * BAR_DELAY_MS;
        const envelope = levelAt(speechTime);
        // Negative spatial phases carry the taller crests left to right even
        // during sustained speech. Multiplying by the envelope keeps pauses still.
        const variation = 0.5
          + 0.35 * Math.sin(speechTime * 0.012 - index * 0.85)
          + 0.15 * Math.sin(speechTime * 0.019 - index * 1.7);
        const texture = 0.08 + 0.92 * Math.pow(variation, 1.7);
        const target = envelope * texture * contour[index];
        const timeConstant = target > current ? ATTACK_MS : RELEASE_MS;
        let next = current + (target - current) * (1 - Math.exp(-elapsed / timeConstant));
        if (target === 0 && next < 0.01) next = 0;
        displayed[index] = next;
        moving ||= next > 0;
        bar.style.height = `${MIN_HEIGHT + next * (MAX_HEIGHT - MIN_HEIGHT)}px`;
      });
      waveform.classList.toggle("idle", !moving);
      frameId = requestAnimationFrame(tick);
    }

    window.memoOverlay.onAudioLevels((levels) => {
      // Late microphone callbacks cannot restart the animation after recording.
      if (!isRecording) return;
      const safeLevels = Array.from({ length: 7 }, (_, index) => {
        const value = Array.isArray(levels) ? levels[index] : 0;
        return Number.isFinite(value) ? Math.max(0, Math.min(1, value)) : 0;
      });
      lastAudioUpdate = Date.now();
      const peak = Math.max(...safeLevels);
      // Separate open/close thresholds prevent flicker around the noise floor.
      gateOpen = peak >= (gateOpen ? CLOSE_THRESHOLD : OPEN_THRESHOLD);
      // Lift speech above the gate for more visible motion without lifting noise.
      const speech = Math.max(0, (peak - CLOSE_THRESHOLD) / (1 - CLOSE_THRESHOLD));
      inputLevel = gateOpen ? Math.min(1, Math.pow(speech, 0.65) * 1.1) : 0;
    });

    window.memoOverlay.onStatus((status) => {
      const wasRecording = isRecording;
      isRecording = status.isRecording;
      if (status.primaryColor && status.primaryColor !== primaryColor) {
        primaryColor = status.primaryColor;
        document.documentElement.style.setProperty("--primary-color", primaryColor);
      }
      if (isRecording && !wasRecording) {
        resetBars();
        lastAudioUpdate = Date.now();
        lastFrame = performance.now();
        frameId = requestAnimationFrame(tick);
      } else if (!isRecording) {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        resetBars();
      }
    });

    document.documentElement.style.setProperty("--primary-color", primaryColor);
  </script>
</body>
</html>
